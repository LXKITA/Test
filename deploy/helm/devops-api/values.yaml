replicaCount: 2

image:
  repository: registry.example.com/devops-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 80

ingress:
  enabled: false
  className: nginx
  host: devops-api.local

database:
  urlSecretName: devops-api-database
  urlSecretKey: url

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101

networkPolicy:
  enabled: true
  ingressNamespaceLabel:
    kubernetes.io/metadata.name: ingress-nginx
