apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitlab.example.com/replace-me/devops-60-days.git
    targetRevision: main
    path: deploy/helm/devops-api
    helm:
      releaseName: course
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-course
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
