stages: [quality, security, build, package]

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

cache:
  paths: [.cache/pip]

python-quality:
  stage: quality
  image: python:3.14-slim
  before_script:
    - python -m pip install -r app/requirements-dev.txt
  script:
    - ruff check app scripts
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

filesystem-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy filesystem --exit-code 1 --severity CRITICAL --scanners vuln,secret,misconfig .

container-build:
  stage: build
  image: docker:latest
  services:
    - name: docker:dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs: [python-quality, filesystem-scan]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull --tag "$IMAGE_TAG" app
    - docker run --rm "$IMAGE_TAG" python -c "import main"
    - docker push "$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

helm-package:
  stage: package
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  needs: [python-quality]
  script:
    - helm lint deploy/helm/devops-api
    - helm package deploy/helm/devops-api --destination packages
  artifacts:
    paths: [packages/]
  rules:
    - if: '$CI_COMMIT_TAG'
